<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>童話衝刺</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #3a2740;
    --cream: #fff8ef;
    --pink: #ff6b9d;
    --rose: #e23e78;
    --gold: #ffc24d;
    --mint: #2fbe96;
    --sky: #6ec8ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #8fd4ff;
    color: var(--ink);
    font-family: "Noto Sans CJK TC", "Noto Sans CJK HK", "Noto Sans CJK SC", "Noto Serif CJK TC", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button, input { font-family: inherit; }
  #view {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  [hidden] { display: none !important; }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
             calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    background: rgba(90, 150, 210, 0.28);
    overflow: auto;
  }
  .card {
    width: min(560px, 100%);
    background: linear-gradient(180deg, #fffdf9 0%, #fff1f7 100%);
    border: 4px solid #fff;
    border-radius: 28px;
    box-shadow: 0 10px 0 rgba(190, 90, 130, 0.18), 0 18px 40px rgba(60, 30, 70, 0.16);
    padding: 22px 22px 16px;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(36px, 8vw, 58px);
    line-height: 1.05;
    letter-spacing: 0.04em;
    color: #ff4f8b;
    text-shadow: 0 3px 0 #ffe0a3, 0 6px 0 rgba(180, 60, 100, 0.18);
  }
  .sub {
    margin: 2px 0 8px;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #7a6a90;
    font-size: 14px;
  }
  .best {
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    margin: 6px 0 12px;
    color: #6a4a20;
    background: #fff6d8;
    border-radius: 999px;
    padding: 8px 12px;
    border: 2px solid #ffe2a0;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button.big {
    display: block;
    width: 100%;
    min-height: 64px;
    margin: 8px 0;
    border: none;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  }
  button.big:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  #btnSolo, #btnAgain { background: linear-gradient(#49d6b0, #149a78); }
  #btnVs, #btnStartVs { background: linear-gradient(#ffb15a, #f06a3a); }
  #btnMenu, #btnPauseMenu, #btnResMenu { background: linear-gradient(#c9b6ff, #7d6ad8); }
  #btnResume { background: linear-gradient(#7ecbff, #3a8dff); }
  #btnRestart, #btnPauseRestart { background: linear-gradient(#ffd36a, #f0a020); color: #5a3a08; }
  .howto {
    margin-top: 8px;
    background: #fff;
    border-radius: 16px;
    padding: 10px 12px 12px;
    border: 2px dashed #ffc2d8;
  }
  .howto h2 { margin: 0 0 4px; font-size: 16px; color: var(--rose); }
  .howto p { margin: 0; font-size: 14px; line-height: 1.55; font-weight: 700; }
  .hint { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: #7c6b88; font-weight: 700; }
  .aiPick { margin: 4px 0 0; text-align: center; }
  .aiPick .lab { font-weight: 900; font-size: 15px; margin-right: 6px; }
  .aiN {
    width: 64px;
    height: 64px;
    margin: 4px;
    border-radius: 18px;
    border: 3px solid #ffd0e2;
    background: #fff;
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    cursor: pointer;
  }
  .aiN.on { background: #ff6b9d; color: #fff; border-color: #fff; box-shadow: 0 4px 0 #c74374; }
  #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #hud button { pointer-events: auto; touch-action: none; }
  #top {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) auto minmax(64px, 1fr);
    align-items: start;
    gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
  }
  #rankCol { justify-self: start; max-width: 46vw; }
  #rankMain {
    display: inline-block;
    font-size: clamp(22px, 4.6vw, 36px);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    background: linear-gradient(#ffe27a, #ffb703);
    border: 3px solid #fff;
    border-radius: 16px;
    padding: 4px 12px 6px;
    text-shadow: 0 2px 0 #d4537a;
    box-shadow: 0 4px 0 #e09020;
    white-space: nowrap;
  }
  #stamLabel { margin: 6px 2px 2px; font-size: 12px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #3a2740; }
  #stamBar {
    width: min(180px, 40vw);
    height: 12px;
    border-radius: 999px;
    background: rgba(40, 20, 40, 0.35);
    border: 2px solid #fff;
    overflow: hidden;
  }
  #stamFill { height: 100%; width: 100%; background: linear-gradient(#b8ff7a, #2fbe55); border-radius: 999px; }
  #timeBox {
    justify-self: center;
    font-variant-numeric: tabular-nums;
    font-weight: 900;
    font-size: clamp(26px, 5vw, 40px);
    color: #fff;
    background: rgba(50, 30, 70, 0.38);
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 16px;
    padding: 4px 14px 6px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    letter-spacing: 0.04em;
  }
  #btnPause {
    justify-self: end;
    width: 64px;
    height: 64px;
    border: 3px solid #fff;
    border-radius: 18px;
    background: linear-gradient(#fff, #ffe1ee);
    color: #c74374;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 4px 0 #e7a0b8;
    cursor: pointer;
  }
  #btnPause:active { transform: translateY(2px); }
  #track {
    position: relative;
    height: 22px;
    margin: 8px calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    background: rgba(255,255,255,0.62);
    border: 2px solid #fff;
    border-radius: 999px;
    box-shadow: inset 0 2px 4px rgba(80,40,60,0.12);
  }
  #trackFill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #7aa7ff, #ff86b7);
    opacity: 0.9;
  }
  .mark { position: absolute; top: -4px; width: 3px; height: 26px; transform: translateX(-50%); border-radius: 2px; }
  .mark.start { background: #1aa87a; }
  .mark.cp { background: #ffd15c; top: -1px; height: 22px; }
  .mark.finish { background: #ff4f8b; width: 4px; }
  .mark.finish::after, .mark.start::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .mark.start::after { border-left: 8px solid #1aa87a; }
  .mark.finish::after { border-left: 9px solid #ff4f8f; }
  .dot {
    position: absolute;
    top: 50%;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    z-index: 1;
  }
  .dot.me {
    width: 16px;
    height: 16px;
    border: 2px solid #fff;
    z-index: 3;
    box-shadow: 0 0 0 2px #3a2740;
  }
  #leftPad, #rightPad {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex;
    gap: 12px;
    z-index: 3;
    pointer-events: auto;
  }
  #leftPad { left: calc(14px + env(safe-area-inset-left)); }
  #rightPad { right: calc(14px + env(safe-area-inset-right)); }
  .ctrl {
    width: 76px;
    height: 76px;
    min-width: 64px;
    min-height: 64px;
    border-radius: 22px;
    border: 3px solid #fff;
    font-size: 28px;
    font-weight: 900;
    color: #4a2a40;
    background: linear-gradient(#fff, #ffe4f0);
    box-shadow: 0 5px 0 #e59ab8, 0 8px 16px rgba(0,0,0,0.12);
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  .ctrl:active { transform: translateY(3px); box-shadow: 0 2px 0 #e59ab8; }
  #btnJump { background: linear-gradient(#c9ffe8, #3dceaa); color: #085443; box-shadow: 0 5px 0 #1f9a78, 0 8px 16px rgba(0,0,0,0.12); }
  #btnDash { background: linear-gradient(#ffe58a, #ff9f1c); color: #6a3b00; box-shadow: 0 5px 0 #d98416, 0 8px 16px rgba(0,0,0,0.12); }
  #btnDash.low { filter: grayscale(0.55) brightness(0.9); opacity: 0.5; }
  #count {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-size: clamp(64px, 16vw, 132px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 6px 0 #f15bb5, 0 12px 0 rgba(120, 30, 70, 0.25);
  }
  #count.go { font-size: clamp(48px, 12vw, 96px); }
  #penalty {
    position: fixed;
    left: 50%;
    top: 36%;
    z-index: 5;
    transform: translate(-50%, 0);
    pointer-events: none;
    font-size: clamp(36px, 8vw, 56px);
    font-weight: 900;
    color: #ff3d68;
    text-shadow: 0 3px 0 #fff, 0 6px 0 #c9184a;
  }
  #penalty.go { animation: floatPen 0.95s ease-out forwards; }
  @keyframes floatPen {
    0% { opacity: 1; transform: translate(-50%, 8px) scale(0.8); }
    30% { transform: translate(-50%, -6px) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1); }
  }
  .panelTitle { text-align: center; font-size: 32px; margin: 0 0 8px; color: #ff4f8b; }
  table.board {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-weight: 800;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  table.board th, table.board td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #ffe0ea; }
  table.board th { background: #ffe9f3; color: #a03362; }
  table.board tr.me { background: #fff4c4; }
  .newrec {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: #f08a14;
    margin: 4px 0;
    text-shadow: 0 2px 0 #ffe7b0;
  }
  .soloTime { text-align: center; font-size: 20px; font-weight: 900; margin: 4px 0; }
  @media (max-height: 460px) {
    .card { padding: 8px 12px; border-radius: 18px; }
    h1 { font-size: 26px; }
    .best { margin: 2px 0; padding: 4px 8px; font-size: 14px; }
    button.big { min-height: 64px; margin: 4px 0; font-size: 18px; }
    .howto p { font-size: 12px; }
    .aiN { width: 64px; height: 64px; }
    .panelTitle { font-size: 22px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div id="rankCol">
      <div id="rankMain">檢查點 0/3</div>
      <div id="stamLabel">體力</div>
      <div id="stamBar"><div id="stamFill"></div></div>
    </div>
    <div id="timeBox">00:00.00</div>
    <button id="btnPause" type="button" aria-label="暫停">❚❚</button>
  </div>
  <div id="track">
    <div id="trackFill"></div>
    <div id="trackMarks"></div>
    <div id="trackDots"></div>
  </div>
  <div id="leftPad">
    <button id="btnLeft" class="ctrl" type="button" aria-label="左">◀</button>
    <button id="btnRight" class="ctrl" type="button" aria-label="右">▶</button>
  </div>
  <div id="rightPad">
    <button id="btnJump" class="ctrl" type="button" aria-label="跳">跳</button>
    <button id="btnDash" class="ctrl" type="button" aria-label="衝">衝</button>
  </div>
</div>

<div id="count" hidden>3</div>
<div id="penalty" hidden>+2 秒</div>

<div id="pause" class="overlay" hidden>
  <div class="card">
    <h2 class="panelTitle">暫停</h2>
    <button id="btnResume" class="big" type="button">繼續</button>
    <button id="btnPauseRestart" class="big" type="button">重新開始</button>
    <button id="btnPauseMenu" class="big" type="button">主選單</button>
  </div>
</div>

<div id="results" class="overlay" hidden>
  <div class="card">
    <h2 id="resTitle" class="panelTitle">衝線！</h2>
    <div id="resBody"></div>
    <button id="btnAgain" class="big" type="button">再玩一次</button>
    <button id="btnResMenu" class="big" type="button">主選單</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>童話衝刺</h1>
    <p class="sub">TALES DASH</p>
    <div id="bestLine" class="best">最佳時間：未有紀錄</div>
    <button id="btnSolo" class="big" type="button">自己玩</button>
    <div class="aiPick">
      <span class="lab">對手人數</span>
      <button class="aiN" type="button" data-n="3">3</button>
      <button class="aiN on" type="button" data-n="4">4</button>
      <button class="aiN" type="button" data-n="5">5</button>
    </div>
    <button id="btnVs" class="big" type="button">同電腦鬥</button>
    <div class="howto">
      <h2>玩法</h2>
      <p>← → 移動、跳（可二段跳）、衝（用體力）、跌落坑洞會回到檢查點並加 2 秒、踩彈跳蘑菇走上層捷徑</p>
      <p class="hint">鍵盤：← → 或 A D 移動、空白鍵／↑／W 跳躍、Shift／K 衝刺、P／Esc 暫停、R 重新開始</p>
    </div>
  </div>
</div>

<script>
'use strict';
/* 童話衝刺 Tales Dash — original fairy-tale footrace. Canvas art, no external assets. */

/* ================= config ================= */
var WORLD_H = 540;
var GY = 410;
var PW = 32;
var PH = 64;
var GRAVITY = 1450;
var JUMP_V = -690;
var DJUMP_V = -610;
var AIR_TIME = (2 * 690) / 1450;
var MAX_RUN = 136;
var MAX_BACK = 100;
var ACCEL = 780;
var AIR_ACCEL = 480;
var DASH_ACCEL = 1400;
var FRICTION = 980;
var AIR_FRIC = 140;
var DASH_MULT = 1.5;
var STAR_MULT = 1.24;
var STAR_TIME = 3.3;
var MUD_MULT = 0.5;
var STAMINA_MAX = 100;
var STAMINA_DRAIN = 52;
var STAMINA_REGEN = 12;
var STAMINA_MIN = 12;
var PAD_V = -900;
var PENALTY = 2;
var STEP = 1 / 120;
var MIN_VIEW_W = 600;
var FINISH_X = 11700;
var TRACK_LEN = FINISH_X;
var DRAW_BOTTOM = 1700;
var FONT = '"Noto Sans CJK TC", "Noto Sans CJK HK", "Noto Sans CJK SC", sans-serif';

var CHECKPOINTS = [3000, 5300, 9000];
var MUD = [6600, 8500];
var GROUND = [
  [-600, 1320],
  [1410, 2780],
  [2880, 4480],
  [4590, 6260],
  [6410, 8740],
  [8840, 10760],
  [10856, 13200]
];
var PLATS = [
  [5660, 7550, GY - 148],
  [7650, 8920, GY - 148],
  [9030, 9800, GY - 72]
];
var PAD = { x: 5740, w: 46, hot: 0 };
var OBSTACLES = [
  { type: 'mush', x: 500, w: 50, h: 48 },
  { type: 'books', x: 980, w: 64, h: 58 },
  { type: 'fence', x: 1700, w: 88, h: 36 },
  { type: 'mush', x: 2150, w: 50, h: 50 },
  { type: 'books', x: 2500, w: 60, h: 56 },
  { type: 'fence', x: 3400, w: 92, h: 36 },
  { type: 'mush', x: 3950, w: 50, h: 48 },
  { type: 'books', x: 4250, w: 62, h: 58 },
  { type: 'mush', x: 4950, w: 50, h: 46 },
  { type: 'books', x: 6900, w: 62, h: 56 },
  { type: 'fence', x: 7600, w: 100, h: 38 },
  { type: 'mush', x: 8200, w: 50, h: 50 },
  { type: 'books', x: 11120, w: 64, h: 56 }
];
var THORNS = [
  { x: 9920, w: 36, h: 42 },
  { x: 10340, w: 34, h: 46 },
  { x: 10700, w: 36, h: 40 }
];
var STARS = [
  { x: 1900, y: GY - 64 },
  { x: 3600, y: GY - 70 },
  { x: 5150, y: GY - 66 },
  { x: 7000, y: GY - 190 },
  { x: 8300, y: GY - 190 },
  { x: 7350, y: GY - 64 },
  { x: 9680, y: GY - 68 },
  { x: 11440, y: GY - 66 }
];
var SIGNS = [
  { x: 5620, y: GY - 118, text: '捷徑' },
  { x: 6520, y: GY - 118, text: '泥沼' },
  { x: 9460, y: GY - 118, text: '荊棘' }
];

var AI_ROSTER = [
  { name: '小兔寶', color: '#ff6fa5', shoe: '#ffd0e4', skin: '#ffe4d2', kind: 'bunny',
    profile: { speed: 0.86, jump: 0.78, shortcut: 0.55, fall: 0.13, dash: 0.38 } },
  { name: '南瓜仔', color: '#ff8c2a', shoe: '#ffe0b8', skin: '#ffe6c8', kind: 'pumpkin',
    profile: { speed: 0.8, jump: 0.88, shortcut: 0.24, fall: 0.07, dash: 0.22 } },
  { name: '糖糖', color: '#2ec8b0', shoe: '#d8fff4', skin: '#ffe3d4', kind: 'candy',
    profile: { speed: 0.91, jump: 0.66, shortcut: 0.74, fall: 0.2, dash: 0.52 } },
  { name: '星星妹', color: '#f0b429', shoe: '#fff1c4', skin: '#ffe8d0', kind: 'star',
    profile: { speed: 0.97, jump: 0.9, shortcut: 0.84, fall: 0.05, dash: 0.66 } },
  { name: '蘑菇叔', color: '#e23d4a', shoe: '#ffd0d4', skin: '#ffdfc8', kind: 'mush',
    profile: { speed: 0.84, jump: 0.72, shortcut: 0.9, fall: 0.16, dash: 0.34 } }
];
var AUTO_PROFILE = { speed: 1, jump: 0.99, shortcut: 1, fall: 0, dash: 0.95 };

/* ================= level ================= */
var surfaces = [];
var decorTrees = [];
var clouds = [];
var balloons = [];

function buildLevel() {
  surfaces.length = 0;
  var i;
  for (i = 0; i < GROUND.length; i++) {
    surfaces.push({ a: GROUND[i][0], b: GROUND[i][1], y: GY, kind: 'g' });
  }
  for (i = 0; i < PLATS.length; i++) {
    surfaces.push({ a: PLATS[i][0], b: PLATS[i][1], y: PLATS[i][2], kind: 'p' });
  }
  for (i = 0; i < OBSTACLES.length; i++) {
    OBSTACLES[i].top = GY - OBSTACLES[i].h;
  }
  for (i = 0; i < THORNS.length; i++) {
    THORNS[i].top = GY - THORNS[i].h;
  }
  decorTrees.length = 0;
  for (var x = 80; x < 12800; x += 250) {
    var tx = x + ((x * 13) % 90) - 20;
    if (gapAt(tx)) continue;
    decorTrees.push({
      x: tx,
      s: 0.85 + ((x >> 3) % 5) * 0.07,
      hue: x % 4,
      candy: (x / 250) % 2 < 1
    });
  }
  clouds = [
    { x: 80, y: 70, w: 120, p: 0.18 },
    { x: 420, y: 120, w: 90, p: 0.22 },
    { x: 760, y: 54, w: 140, p: 0.15 },
    { x: 1100, y: 150, w: 80, p: 0.28 },
    { x: 250, y: -80, w: 100, p: 0.12 },
    { x: 900, y: -30, w: 70, p: 0.2 }
  ];
  balloons = [
    { x: 640, y: GY - 230, c: '#ff7aa8' },
    { x: 2200, y: GY - 260, c: '#7fd0ff' },
    { x: 4100, y: GY - 240, c: '#ffe06a' },
    { x: 8600, y: GY - 250, c: '#b9a0ff' },
    { x: 10400, y: GY - 270, c: '#7eecb8' }
  ];
  validateLevel();
}

function gapAt(x) {
  var on = false;
  for (var i = 0; i < GROUND.length; i++) {
    if (x >= GROUND[i][0] && x <= GROUND[i][1]) on = true;
  }
  return !on && x > 0 && x < FINISH_X;
}

function validateLevel() {
  function onG(x) {
    for (var i = 0; i < GROUND.length; i++) {
      if (x >= GROUND[i][0] && x <= GROUND[i][1]) return true;
    }
    return false;
  }
  var c;
  for (c = 0; c < CHECKPOINTS.length; c++) {
    if (!onG(CHECKPOINTS[c] + 30)) throw new Error('checkpoint off ground');
  }
  if (!onG(200) || !onG(FINISH_X)) throw new Error('spawn or finish off ground');
  if (!onG(PAD.x + PAD.w * 0.5)) throw new Error('pad off ground');
  for (c = 0; c < OBSTACLES.length; c++) {
    if (!onG(OBSTACLES[c].x + OBSTACLES[c].w * 0.5)) throw new Error('obstacle off ground');
  }
  for (c = 0; c < THORNS.length; c++) {
    if (!onG(THORNS[c].x + THORNS[c].w * 0.5)) throw new Error('thorn off ground');
  }
}

/* ================= physics ================= */
function stepAll(dt) {
  if (screen === 'paused') return;
  animT += dt;
  if (screen === 'menu') {
    menuPan += dt * 36;
    return;
  }
  if (screen === 'countdown') {
    cdT += dt;
    if (cdT >= CD[cdI].dur) {
      cdI++;
      cdT = 0;
      if (cdI >= CD.length) beginRun();
      else { showCD(); sfxCount(CD[cdI].text); }
    }
    for (var i = 0; i < runners.length; i++) runners[i].phase += dt * 8;
    updateFX(dt);
    updateCamera(dt);
    return;
  }
  if (screen !== 'race') {
    updateFX(dt);
    return;
  }
  for (var r = 0; r < runners.length; r++) {
    var runner = runners[r];
    if (!runner.finished) runner.time += dt;
    var input;
    if (runner.hurt > 0) {
      runner.hurt -= dt;
      runner.vx = 0;
      runner.vy = 0;
      if (runner.hurt <= 0) respawn(runner);
      continue;
    }
    if (runner.isPlayer) {
      input = autopilotOn ? think(runner, dt) : readPlayer();
    } else {
      input = think(runner, dt);
    }
    if (!runner.finished) stepRunner(runner, input, dt);
  }
  rankRunners();
  raceFlow(dt);
  updateFX(dt);
  updateCamera(dt);
  if (fade > 0) fade = Math.max(0, fade - dt * 1.7);
  if (shake > 0) shake = Math.max(0, shake - dt * 18);
  if (PAD.hot > 0) PAD.hot = Math.max(0, PAD.hot - dt * 3);
}

function readPlayer() {
  var jump = jumpQueued;
  jumpQueued = false;
  return {
    left: keyL || touchL,
    right: keyR || touchR,
    dash: keyD || touchD,
    jump: jump
  };
}

function stepRunner(r, input, dt) {
  if (r.grace > 0) r.grace -= dt;
  if (r.finished) return;

  var canStart = r.stamina > STAMINA_MIN || r.dashing;
  if (input.dash && canStart && r.stamina > 0) {
    r.dashing = true;
    r.stamina = Math.max(0, r.stamina - STAMINA_DRAIN * dt);
    if (r.stamina <= 0) r.dashing = false;
  } else {
    r.dashing = false;
    r.stamina = Math.min(STAMINA_MAX, r.stamina + STAMINA_REGEN * dt);
  }
  if (r.starT > 0) r.starT -= dt;

  var cap = MAX_RUN * (r.isPlayer ? 1 : r.speedMul);
  if (r.starT > 0) cap *= STAR_MULT;
  if (r.dashing) cap *= DASH_MULT;
  var muddy = inMud(r);
  if (muddy) cap *= MUD_MULT;

  var accel = r.dashing ? DASH_ACCEL : (r.onGround ? ACCEL : AIR_ACCEL);
  if (input.left && input.right) input = { left: false, right: true, dash: input.dash, jump: input.jump };
  if (input.right) {
    if (r.vx < cap) r.vx = Math.min(cap, r.vx + accel * dt);
  } else if (input.left) {
    if (r.vx > -MAX_BACK) r.vx = Math.max(-MAX_BACK, r.vx - accel * dt);
  } else {
    var fr = r.onGround ? FRICTION : AIR_FRIC;
    if (r.vx > 0) r.vx = Math.max(0, r.vx - fr * dt);
    else if (r.vx < 0) r.vx = Math.min(0, r.vx + fr * dt);
  }
  if (r.vx > cap) r.vx = Math.max(cap, r.vx - 740 * dt);
  if (Math.abs(r.vx) > 8) r.facing = r.vx < 0 ? -1 : 1;

  r.x += r.vx * dt;
  if (r.x < 36) { r.x = 36; if (r.vx < 0) r.vx = 0; }
  collideObsX(r);

  if (input.jump) r.jumpBuf = 0.14;
  else r.jumpBuf = Math.max(0, r.jumpBuf - dt);

  if (r.onGround) r.coyote = 0.12;
  else {
    r.coyote -= dt;
    if (r.coyote <= 0 && r.jumpsLeft === 2) r.jumpsLeft = 1;
  }

  if (r.jumpBuf > 0 && r.jumpsLeft > 0) {
    var first = r.jumpsLeft === 2;
    var allow = first ? (r.onGround || r.coyote > 0) : true;
    if (allow) {
      r.jumpsLeft--;
      r.vy = first ? JUMP_V : DJUMP_V;
      r.onGround = false;
      r.coyote = 0;
      r.jumpBuf = 0;
      r.squish = 0;
      if (r.isPlayer) sfxJump();
      burst(r.x, r.y, 5, 'dust');
    }
  }

  var prevY = r.y;
  var wasGround = r.onGround;
  if (!r.onGround) {
    r.vy += GRAVITY * dt;
    if (r.vy > 980) r.vy = 980;
  } else if (!input.jump) {
    r.vy = 0;
  }
  r.y += r.vy * dt;
  r.onGround = false;
  landSurfaces(r, prevY);
  landObstacles(r, prevY);
  if (r.onGround && !wasGround) {
    r.jumpsLeft = 2;
    r.armDouble = false;
    r.airT = 0;
    r.squish = 1;
    if (Math.abs(r.vx) > 40) burst(r.x, r.y, 6, 'dust');
    r.vy = 0;
  }
  if (r.onGround) r.airT = 0;
  else r.airT += dt;
  if (r.squish > 0) r.squish = Math.max(0, r.squish - dt * 5);

  checkPad(r);
  checkStars(r);
  checkPoints(r);

  if (r.grace <= 0 && hitThorn(r)) {
    fall(r);
    return;
  }
  if (r.y > GY + 170) {
    fall(r);
    return;
  }

  if (r.onGround && Math.abs(r.vx) > 50) {
    r.phase += dt * Math.abs(r.vx) * 0.045;
    if (!r._dust || r.phase - r._dust > 0.9) {
      r._dust = r.phase;
      burst(r.x, r.y, 2, 'dust');
    }
  } else {
    r.phase += dt * 3;
  }

  if (r.dashing && r.isPlayer && (!r._spark || animT - r._spark > 0.08)) {
    r._spark = animT;
    burst(r.x - r.facing * 10, r.y - 30, 2, 'spark');
  }

  if (r.x >= FINISH_X) {
    r.x = FINISH_X;
    r.vx = 0;
    r.finished = true;
    r.finishTime = r.time;
    r.dashing = false;
    if (r.isPlayer) onPlayerFinish();
    else burst(r.x, r.y - 40, 10, 'conf');
  }
}

function inMud(r) {
  return r.onGround && r.y > GY - 20 && r.x > MUD[0] && r.x < MUD[1];
}

function collideObsX(r) {
  for (var i = 0; i < OBSTACLES.length; i++) {
    var o = OBSTACLES[i];
    var L = r.x - PW / 2, R = r.x + PW / 2;
    var T = r.y - PH, B = r.y;
    if (R <= o.x || L >= o.x + o.w || B <= o.top + 2 || T >= GY) continue;
    if (r.x < o.x + o.w / 2) r.x = o.x - PW / 2 - 0.3;
    else r.x = o.x + o.w + PW / 2 + 0.3;
    r.vx = 0;
  }
}

function landSurfaces(r, prevY) {
  if (r.vy < 0 && r.y < prevY) return;
  var best = null;
  for (var i = 0; i < surfaces.length; i++) {
    var s = surfaces[i];
    if (r.x < s.a || r.x > s.b) continue;
    if (prevY <= s.y + 2 && r.y >= s.y) {
      if (!best || s.y < best.y) best = s;
    }
  }
  if (best) {
    r.y = best.y;
    r.vy = 0;
    r.onGround = true;
  }
}

function landObstacles(r, prevY) {
  if (r.vy < 0) return;
  for (var i = 0; i < OBSTACLES.length; i++) {
    var o = OBSTACLES[i];
    var L = r.x - PW / 2, R = r.x + PW / 2;
    if (R <= o.x + 2 || L >= o.x + o.w - 2) continue;
    if (prevY <= o.top + 2 && r.y >= o.top && r.y <= o.top + Math.min(o.h, 28)) {
      if (!r.onGround || o.top < r.y) {
        r.y = o.top;
        r.vy = 0;
        r.onGround = true;
      }
    }
  }
}

function checkPad(r) {
  if (!r.onGround) return;
  if (Math.abs(r.y - GY) > 8) return;
  if (r.x >= PAD.x && r.x <= PAD.x + PAD.w) {
    r.vy = PAD_V;
    r.onGround = false;
    r.jumpsLeft = 1;
    r.coyote = 0;
    PAD.hot = 1;
    burst(r.x, r.y, 8, 'spark');
    if (r.isPlayer) sfxPad();
  }
}

function checkStars(r) {
  var cy = r.y - PH * 0.45;
  for (var i = 0; i < STARS.length; i++) {
    if (r.gotStar[i]) continue;
    var s = STARS[i];
    var dx = r.x - s.x;
    var dy = cy - s.y;
    if (dx * dx + dy * dy < 50 * 50) {
      r.gotStar[i] = 1;
      r.starT = Math.max(r.starT, STAR_TIME);
      burst(s.x, s.y, 10, 'spark');
      if (r.isPlayer) sfxStar();
    }
  }
}

function checkPoints(r) {
  for (var i = 0; i < CHECKPOINTS.length; i++) {
    if (r.cp < i && r.x >= CHECKPOINTS[i]) {
      r.cp = i;
      if (r.isPlayer) {
        sfxCheckpoint();
        floats.push({ x: r.x, y: r.y - 80, text: '檢查點', life: 1, color: '#ffe08a' });
      }
    }
  }
}

function hitThorn(r) {
  var L = r.x - PW / 2 + 8, R = r.x + PW / 2 - 8;
  var B = r.y - 6;
  var T = r.y - 36;
  for (var i = 0; i < THORNS.length; i++) {
    var th = THORNS[i];
    if (R > th.x + 2 && L < th.x + th.w - 2 && B > th.top + 4 && T < GY - 2) return true;
  }
  return false;
}

function fall(r) {
  if (r.finished || r.hurt > 0) return;
  r.hurt = 0.42;
  r.time += PENALTY;
  r.vx = 0;
  r.vy = 0;
  r.dashing = false;
  floats.push({ x: r.x, y: r.y - 70, text: '+2 秒', life: 1.15, color: '#ff4d6d' });
  if (r.isPlayer) {
    fade = 0.72;
    shake = 7;
    showPenalty();
    sfxFall();
  }
}

function respawn(r) {
  var x = 200;
  if (r.cp >= 0) x = CHECKPOINTS[r.cp] + 36;
  r.x = x;
  r.y = GY;
  r.vx = 0;
  r.vy = 0;
  r.onGround = true;
  r.jumpsLeft = 2;
  r.coyote = 0.12;
  r.armDouble = false;
  r.grace = 0.45;
  r.squish = 0;
  r.stuck = 0;
  r.seenGap = null;
  r.missGap = false;
  r.seenThorn = null;
  r.missThorn = false;
  r.thornArm = null;
  r.aiHeld = false;
  r.armDouble = false;
}

function onPlayerFinish() {
  burst(player.x, player.y - 50, 28, 'conf');
  burst(player.x - 20, player.y - 80, 12, 'spark');
  sfxFinish();
  soloWait = 0.6;
  postT = 0;
}

function raceFlow(dt) {
  if (!player || !player.finished) return;
  if (mode === 'solo') {
    soloWait -= dt;
    if (soloWait <= 0) showResults();
  } else {
    postT += dt;
    var all = true;
    for (var i = 0; i < runners.length; i++) if (!runners[i].finished) all = false;
    if (all || postT >= 20) showResults();
  }
}

function rankRunners() {
  var list = runners.slice();
  list.sort(function (a, b) {
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (Math.abs(a.x - b.x) > 0.4) return b.x - a.x;
    if (a.isPlayer) return -1;
    if (b.isPlayer) return 1;
    return 0;
  });
  for (var i = 0; i < list.length; i++) list[i].rank = i + 1;
}

/* ================= AI ================= */
function profileOf(r) {
  if (r.isPlayer) return AUTO_PROFILE;
  return r.profile || AUTO_PROFILE;
}

function findSurface(x, feet) {
  var best = null;
  for (var i = 0; i < surfaces.length; i++) {
    var s = surfaces[i];
    if (x < s.a || x > s.b) continue;
    var dy = Math.abs(s.y - feet);
    if (dy <= 16 && (!best || s.y < best.y)) best = s;
  }
  return best;
}

function findNextSurface(s) {
  var best = null;
  for (var i = 0; i < surfaces.length; i++) {
    var t = surfaces[i];
    if (t === s) continue;
    if (t.a < s.b - 4) continue;
    if (t.y < s.y - 36) continue;
    if (t.y > s.y + 240) continue;
    if (t.a - s.b > 420) continue;
    if (!best || t.a < best.a) best = t;
  }
  return best;
}

function think(r, dt) {
  var prof = profileOf(r);
  var jump = false;
  var dash = false;
  var force = false;

  if (r.wantShortcut == null && r.x > 4700) {
    r.wantShortcut = Math.random() < prof.shortcut;
  }

  var surf = r.onGround ? findSurface(r.x, r.y) : null;
  var gapDist = null, gapW = 0, gapId = null;
  if (surf) {
    var nxt = findNextSurface(surf);
    if (nxt && nxt.a - surf.b > 24) {
      gapDist = surf.b - r.x;
      gapW = nxt.a - surf.b;
      gapId = surf.b;
    }
  }

  var obsDist = null;
  if (r.onGround) {
    for (var i = 0; i < OBSTACLES.length; i++) {
      var o = OBSTACLES[i];
      var d = o.x - (r.x + PW * 0.45);
      if (d < -6 || d > 70) continue;
      if (o.top < r.y - 8 && o.top + o.h >= r.y - 16) {
        if (obsDist == null || d < obsDist) obsDist = d;
      }
    }
  }

  var thornDist = null, thornId = null;
  if (r.onGround && r.y > GY - 30) {
    for (var t = 0; t < THORNS.length; t++) {
      var th = THORNS[t];
      var td = th.x - (r.x + PW * 0.4);
      if (td < -8 || td > 80) continue;
      if (thornDist == null || td < thornDist) { thornDist = td; thornId = th.x; }
    }
  }

  var padDist = (r.y > GY - 24) ? (PAD.x - r.x) : 9999;

  var commitPad = r.wantShortcut !== false && r.onGround && r.y > GY - 24 &&
    padDist < 170 && padDist > -PAD.w - 8;

  if (surf && gapDist != null && !commitPad) {
    var spd = Math.max(70, r.vx);
    var clear = spd * AIR_TIME;
    var lead = clear - gapW - 20;
    if (lead > 48) lead = 48;
    lead = lead - (1 - prof.jump) * 14;
    if (lead < 8) lead = 8;
    if (r.seenGap !== gapId && gapDist < 220) {
      r.seenGap = gapId;
      r.missGap = gapW > 80 && Math.random() < prof.fall;
    }
    var wide = gapW > clear * 0.88;
    if (r.missGap && r.seenGap === gapId) {
      if (gapDist < 2) jump = true;
    } else if (gapDist <= lead && gapDist >= lead - 16) {
      jump = true;
      if (wide) r.armDouble = true;
    } else if (!r.missGap && gapDist < 12 && gapDist > 0) {
      jump = true;
      if (wide) r.armDouble = true;
    }
    if (wide && gapDist < 210 && gapDist > 0 && r.stamina > 12) dash = true;
  }

  if (!commitPad && obsDist != null && obsDist < 40 && obsDist > 12) jump = true;

  if (!commitPad && thornDist != null) {
    if (r.seenThorn !== thornId) {
      r.seenThorn = thornId;
      r.missThorn = Math.random() < prof.fall * 0.55;
      r.thornArm = null;
    }
    if (!r.missThorn && thornDist < 34 && thornDist > 14 && r.thornArm !== thornId) {
      r.thornArm = thornId;
      r.aiHeld = false;
      jump = true;
    }
  }

  if (r.onGround && r.y > GY - 24 && padDist < 38 && padDist > 8 && r.wantShortcut === false) {
    jump = true;
    r.armDouble = false;
  }
  if (commitPad) {
    jump = false;
    if (padDist < 150 && r.stamina > 8) dash = true;
  }

  if (r.armDouble && !r.onGround && r.jumpsLeft > 0 && r.vy > -120 && r.airT > 0.1) {
    force = true;
    r.armDouble = false;
  } else if (!r.onGround && r.jumpsLeft > 0 && r.vy > 160 && r.airT > 0.34) {
    var look = r.x + Math.max(36, r.vx) * 0.32;
    var safe = false;
    for (var s = 0; s < surfaces.length; s++) {
      var sf = surfaces[s];
      if (look >= sf.a && r.x - 8 <= sf.b && sf.y >= r.y - 8 && sf.y < r.y + 200) safe = true;
    }
    if (!safe) force = true;
  }

  if (r.onGround) {
    if (prof.dash >= 0.9 && !inMud(r)) {
      if (r.stamina > 58 || (r.dashing && r.stamina > 24)) dash = true;
    } else if (!inMud(r) && r.stamina > 34) {
      if (r.dashLeft > 0) { dash = true; r.dashLeft -= dt; }
      else if (Math.random() < prof.dash * dt * 0.55) r.dashLeft = 0.32 + Math.random() * 0.35;
    }
  }
  if (r.stamina < 8) dash = false;
  if (inMud(r) && prof.dash < 0.9) dash = false;

  if (r.onGround && r.vx < 28 && r.x < FINISH_X - 8 && !commitPad) {
    r.stuck += dt;
    if (r.stuck > 0.22) jump = true;
  } else r.stuck = 0;

  if (r.onGround && jump) { /* keep armDouble if set this call */ }
  else if (r.onGround && !jump) {
    /* don't clear armDouble the same moment we leave the ground; only when cruising */
    if (gapDist == null || gapDist > 80) r.armDouble = false;
  }

  var edge = force || (jump && !r.aiHeld);
  r.aiHeld = jump && !force;
  return { left: false, right: r.x < FINISH_X + 10, dash: dash, jump: edge };
}

/* ================= fx ================= */
function burst(x, y, n, kind) {
  for (var i = 0; i < n; i++) {
    var sp = kind === 'dust' ? 70 : 150;
    parts.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 6,
      vx: (Math.random() * 2 - 1) * sp,
      vy: kind === 'dust' ? -30 - Math.random() * 70 : -60 - Math.random() * 180,
      life: 0.35 + Math.random() * 0.4,
      max: 0.7,
      kind: kind,
      s: 2 + Math.random() * 3,
      c: kind === 'conf' ? ['#ff6b9d', '#ffd15c', '#7fd0ff', '#7eecb8', '#fff'][i % 5] :
         kind === 'spark' ? '#ffe36a' : '#e6c29a'
    });
  }
  if (parts.length > 220) parts.splice(0, parts.length - 220);
}

function updateFX(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += (p.kind === 'dust' ? 280 : 80) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (var f = floats.length - 1; f >= 0; f--) {
    floats[f].life -= dt;
    floats[f].y -= 28 * dt;
    if (floats[f].life <= 0) floats.splice(f, 1);
  }
}

function updateCamera(dt) {
  if (!player) return;
  var target = player.x - viewW * 0.36;
  var max = Math.max(0, FINISH_X + 280 - viewW);
  if (target < 0) target = 0;
  if (target > max) target = max;
  var k = 1 - Math.pow(0.0015, dt);
  camX += (target - camX) * (k > 1 ? 1 : k);
  if (screen === 'countdown' && player.x < 400) camX = 0;
}

/* ================= render ================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  var byH = cssH / WORLD_H;
  var byW = cssW / MIN_VIEW_W;
  viewScale = Math.min(byH, byW);
  if (viewScale < 0.01) viewScale = 0.01;
  viewW = cssW / viewScale;
  viewH = cssH / viewScale;
  var worldScreenH = WORLD_H * viewScale;
  offsetY = worldScreenH < cssH ? (cssH - worldScreenH) / 2 : 0;
}

function render() {
  if (!ctx) return;
  var S = viewScale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  var sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#69c4ff');
  sky.addColorStop(0.45, '#b7e6ff');
  sky.addColorStop(0.78, '#fff0c8');
  sky.addColorStop(1, '#c4a06a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  var cam = camX;
  if (screen === 'menu') cam = 80 + (menuPan % 1600);
  var shakeX = shake ? (Math.random() - 0.5) * shake : 0;

  ctx.setTransform(S, 0, 0, S, 0, offsetY * dpr);
  drawParallax(cam);

  ctx.setTransform(S, 0, 0, S, (-cam + shakeX) * S, offsetY * dpr);
  drawWorld(cam);
  if (screen === 'menu') drawCosmetic(cam);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (fade > 0.01) {
    ctx.fillStyle = 'rgba(255,255,255,' + fade.toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  if (screen === 'race' || screen === 'paused' || screen === 'countdown') updateHudDOM();
}

function drawParallax(cam) {
  var horizon = 300;
  hillBand(cam, 0.18, horizon + 10, 26, 0.008, '#d7f5c4');
  hillBand(cam, 0.32, horizon + 36, 34, 0.011, '#b6e89a');
  hillBand(cam, 0.5, horizon + 70, 28, 0.016, '#8ed56f');
  /* distant castle */
  ctx.save();
  var cx = viewW * 0.78 - (cam * 0.08) % 40;
  drawMiniCastle(cx, horizon + 8, 0.55, 0.45);
  ctx.restore();
  /* clouds */
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var span = viewW + 220;
    var x = ((c.x - cam * c.p) % span + span) % span - 80;
    drawCloud(x, c.y, c.w);
  }
}

function hillBand(cam, p, base, amp, wave, color) {
  ctx.beginPath();
  var x0 = -20;
  var x1 = viewW + 20;
  ctx.moveTo(x0, WORLD_H + 400);
  for (var x = x0; x <= x1; x += 18) {
    var wx = x + cam * p;
    var y = base + Math.sin(wx * wave) * amp + Math.sin(wx * wave * 0.45 + 1.3) * amp * 0.4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(x1, WORLD_H + 400);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.42, w * 0.22, 0, 0, 7);
  ctx.ellipse(x + w * 0.28, y + 4, w * 0.28, w * 0.16, 0, 0, 7);
  ctx.ellipse(x - w * 0.26, y + 6, w * 0.24, w * 0.15, 0, 0, 7);
  ctx.fill();
}

function drawMiniCastle(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#f3e2ff';
  ctx.strokeStyle = '#8a6aaa';
  ctx.lineWidth = 2;
  ctx.fillRect(-30, -20, 18, 28);
  ctx.strokeRect(-30, -20, 18, 28);
  ctx.fillRect(12, -28, 18, 36);
  ctx.strokeRect(12, -28, 18, 36);
  ctx.beginPath();
  ctx.moveTo(-34, -20); ctx.lineTo(-21, -34); ctx.lineTo(-8, -20);
  ctx.moveTo(8, -28); ctx.lineTo(21, -44); ctx.lineTo(34, -28);
  ctx.fillStyle = '#d7b4f5';
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawWorld(cam) {
  var i;
  /* pits */
  for (i = 0; i < GROUND.length - 1; i++) {
    var a = GROUND[i][1];
    var b = GROUND[i + 1][0];
    if (b - a < 20) continue;
    if (a > cam + viewW + 40 || b < cam - 40) continue;
    var g = ctx.createLinearGradient(0, GY - 10, 0, GY + 220);
    g.addColorStop(0, '#3a3158');
    g.addColorStop(0.4, '#241833');
    g.addColorStop(1, '#120c18');
    ctx.fillStyle = g;
    ctx.fillRect(a, GY - 8, b - a, 520);
    ctx.fillStyle = '#6b5a78';
    for (var sx = a + 16; sx < b - 8; sx += 22) {
      ctx.beginPath();
      ctx.moveTo(sx, GY + 150);
      ctx.lineTo(sx + 8, GY + 188);
      ctx.lineTo(sx - 8, GY + 188);
      ctx.fill();
    }
  }

  /* ground */
  for (i = 0; i < GROUND.length; i++) {
    var seg = GROUND[i];
    if (seg[1] < cam - 30 || seg[0] > cam + viewW + 30) continue;
    drawGround(seg[0], seg[1]);
  }
  /* mud tint */
  ctx.save();
  for (i = 0; i < GROUND.length; i++) {
    var gseg = GROUND[i];
    var ma = Math.max(gseg[0], MUD[0]);
    var mb = Math.min(gseg[1], MUD[1]);
    if (mb - ma < 4) continue;
    if (mb < cam - 20 || ma > cam + viewW + 20) continue;
    ctx.fillStyle = 'rgba(92, 64, 42, 0.45)';
    ctx.fillRect(ma, GY - 6, mb - ma, 28);
    ctx.fillStyle = 'rgba(160, 120, 70, 0.35)';
    var bx = ma - (ma % 36);
    for (var mx = bx; mx < mb; mx += 36) {
      if (mx < ma) continue;
      ctx.beginPath();
      ctx.ellipse(mx, GY + 10, 8, 4, 0, 0, 7);
      ctx.fill();
    }
  }
  ctx.restore();

  /* platforms */
  for (i = 0; i < PLATS.length; i++) {
    var p = PLATS[i];
    if (p[1] < cam - 20 || p[0] > cam + viewW + 20) continue;
    drawPlatform(p[0], p[1], p[2]);
  }

  /* balloons */
  for (i = 0; i < balloons.length; i++) {
    var bl = balloons[i];
    if (bl.x < cam - 40 || bl.x > cam + viewW + 40) continue;
    drawBalloon(bl.x, bl.y + Math.sin(animT * 1.4 + i) * 6, bl.c);
  }

  /* trees behind runners but in front of hills — already world */
  for (i = 0; i < decorTrees.length; i++) {
    var tree = decorTrees[i];
    if (tree.x < cam - 80 || tree.x > cam + viewW + 80) continue;
    drawTree(tree);
  }

  /* obstacles, thorns, pad, stars, signs, flags, finish */
  for (i = 0; i < OBSTACLES.length; i++) {
    var o = OBSTACLES[i];
    if (o.x > cam + viewW + 40 || o.x + o.w < cam - 40) continue;
    drawObstacle(o);
  }
  for (i = 0; i < THORNS.length; i++) {
    var th = THORNS[i];
    if (th.x > cam + viewW + 30 || th.x + th.w < cam - 30) continue;
    drawThorn(th);
  }
  if (PAD.x < cam + viewW + 40 && PAD.x + PAD.w > cam - 40) drawPad();

  var collector = player;
  for (i = 0; i < STARS.length; i++) {
    if (collector && collector.gotStar[i]) continue;
    var st = STARS[i];
    if (st.x < cam - 30 || st.x > cam + viewW + 30) continue;
    drawStar(st.x, st.y, 16, animT * 2 + i);
  }
  for (i = 0; i < SIGNS.length; i++) {
    if (SIGNS[i].x < cam - 40 || SIGNS[i].x > cam + viewW + 40) continue;
    drawSign(SIGNS[i]);
  }
  drawStartBanner();
  for (i = 0; i < CHECKPOINTS.length; i++) {
    var cxp = CHECKPOINTS[i];
    if (cxp < cam - 40 || cxp > cam + viewW + 40) continue;
    var taken = player && player.cp >= i;
    drawFlag(cxp, taken, i + 1);
  }
  if (FINISH_X > cam - 120 && FINISH_X < cam + viewW + 120) drawFinish();

  /* particles under runners */
  for (i = 0; i < parts.length; i++) {
    var pt = parts[i];
    if (pt.x < cam - 20 || pt.x > cam + viewW + 20) continue;
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.c;
    if (pt.kind === 'spark' || pt.kind === 'conf') {
      ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
    } else {
      ctx.beginPath();
      ctx.ellipse(pt.x, pt.y, pt.s, pt.s * 0.6, 0, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* runners back to front, player last */
  var order = runners.slice().sort(function (a, b) {
    if (a.isPlayer) return 1;
    if (b.isPlayer) return -1;
    return a.x - b.x;
  });
  for (i = 0; i < order.length; i++) drawRunner(order[i], 1, 0);

  for (i = 0; i < floats.length; i++) {
    var fl = floats[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, fl.life));
    ctx.font = '900 22px ' + FONT;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#fff';
    ctx.fillStyle = fl.color;
    ctx.strokeText(fl.text, fl.x, fl.y);
    ctx.fillText(fl.text, fl.x, fl.y);
    ctx.globalAlpha = 1;
  }
}

function drawGround(a, b) {
  var y = GY;
  var grd = ctx.createLinearGradient(0, y, 0, y + 220);
  grd.addColorStop(0, '#e0ac72');
  grd.addColorStop(0.25, '#c4844c');
  grd.addColorStop(1, '#7a4a2c');
  ctx.fillStyle = grd;
  ctx.fillRect(a, y + 12, b - a, DRAW_BOTTOM);
  /* grass */
  ctx.fillStyle = '#67c84a';
  ctx.fillRect(a, y - 2, b - a, 18);
  ctx.fillStyle = '#8ee86a';
  ctx.fillRect(a, y - 2, b - a, 7);
  ctx.fillStyle = '#3e9a32';
  ctx.fillRect(a, y + 14, b - a, 4);
  /* blades and chips, deterministic */
  var x0 = a - (a % 18);
  for (var x = x0; x < b; x += 18) {
    if (x < a) continue;
    ctx.fillStyle = '#4eaf3e';
    ctx.beginPath();
    ctx.moveTo(x, y + 2);
    ctx.lineTo(x + 3, y - 8 - (x % 5));
    ctx.lineTo(x + 6, y + 2);
    ctx.fill();
    if ((x / 18) % 3 === 0) {
      ctx.fillStyle = '#8a5434';
      ctx.beginPath();
      ctx.ellipse(x + 8, y + 36 + (x % 7), 3.2, 2.2, 0, 0, 7);
      ctx.fill();
    }
  }
  /* cookie edge at gaps */
  ctx.fillStyle = '#6b3e24';
  ctx.fillRect(a, y + 16, 6, 40);
  ctx.fillRect(b - 6, y + 16, 6, 40);
}

function drawPlatform(a, b, y) {
  ctx.fillStyle = '#ffd0ea';
  roundRect(a, y - 16, b - a, 22, 8);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#e46aa0';
  ctx.stroke();
  ctx.fillStyle = '#fff6fb';
  ctx.fillRect(a + 4, y - 16, b - a - 8, 6);
  var cols = ['#ff6b9d', '#7fd0ff', '#ffe06a', '#7eecb8'];
  for (var x = a + 10; x < b - 6; x += 16) {
    ctx.fillStyle = cols[(x / 16) % 4 | 0];
    ctx.fillRect(x, y - 12, 4, 3);
  }
}

function drawTree(tree) {
  var y = GY;
  var s = tree.s;
  ctx.save();
  ctx.translate(tree.x, y);
  ctx.scale(s, s);
  ctx.fillStyle = '#c98552';
  ctx.fillRect(-6, -78, 12, 78);
  ctx.strokeStyle = '#7a4a28';
  ctx.lineWidth = 2;
  ctx.strokeRect(-6, -78, 12, 78);
  var colors = ['#ff8fb8', '#8fd4ff', '#ffe07a', '#9cf0c8'];
  var c = colors[tree.hue];
  ctx.fillStyle = c;
  ctx.strokeStyle = '#5a3a48';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, -108, 28, 0, 7);
  ctx.arc(-22, -90, 18, 0, 7);
  ctx.arc(22, -92, 18, 0, 7);
  ctx.fill();
  ctx.stroke();
  if (tree.candy) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(-16, -116, 32, 5);
    ctx.fillRect(-16, -100, 32, 4);
  }
  ctx.restore();
}

function drawBalloon(x, y, color) {
  ctx.fillStyle = color;
  ctx.strokeStyle = '#5a3a48';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y, 14, 18, 0, 0, 7);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y + 18);
  ctx.lineTo(x, y + 48);
  ctx.stroke();
}

function drawObstacle(o) {
  if (o.type === 'mush') drawMushBlock(o);
  else if (o.type === 'books') drawBooks(o);
  else drawFence(o);
}

function drawMushBlock(o) {
  var x = o.x, w = o.w, top = o.top;
  ctx.fillStyle = '#fff3e4';
  ctx.strokeStyle = '#5a3a48';
  ctx.lineWidth = 2.5;
  roundRect(x + w * 0.28, top + w * 0.38, w * 0.44, o.h - w * 0.32, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff5a6a';
  ctx.beginPath();
  ctx.ellipse(x + w / 2, top + 16, w * 0.52, 16, 0, Math.PI, 0);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + w * 0.35, top + 12, 3.2, 0, 7);
  ctx.arc(x + w * 0.62, top + 16, 2.4, 0, 7);
  ctx.fill();
}

function drawBooks(o) {
  var cols = ['#7aa7ff', '#ff8fb3', '#ffd15c'];
  var x = o.x;
  var y = GY;
  var h1 = o.h * 0.42, h2 = o.h * 0.32, h3 = o.h - h1 - h2;
  var specs = [
    { y: y - h3, h: h3, c: cols[0], inset: 4 },
    { y: y - h3 - h2, h: h2, c: cols[1], inset: 0 },
    { y: y - o.h, h: h1, c: cols[2], inset: 6 }
  ];
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3a2740';
  for (var i = 0; i < specs.length; i++) {
    var b = specs[i];
    ctx.fillStyle = b.c;
    ctx.fillRect(x + b.inset, b.y, o.w - b.inset * 2, b.h);
    ctx.strokeRect(x + b.inset, b.y, o.w - b.inset * 2, b.h);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(x + b.inset + 3, b.y + 3, 3, b.h - 6);
  }
}

function drawFence(o) {
  var x = o.x, y = GY, w = o.w, h = o.h;
  ctx.strokeStyle = '#c23b55';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.fillRect(x, y - h, 8, h);
  ctx.strokeRect(x, y - h, 8, h);
  ctx.fillRect(x + w - 8, y - h, 8, h);
  ctx.strokeRect(x + w - 8, y - h, 8, h);
  for (var i = 0; i < 3; i++) {
    var yy = y - h + 6 + i * ((h - 8) / 3);
    ctx.strokeStyle = i % 2 ? '#ff6b8a' : '#fff';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 4, yy);
    ctx.lineTo(x + w - 4, yy);
    ctx.stroke();
  }
}

function drawThorn(th) {
  var x = th.x, top = th.top, w = th.w;
  ctx.fillStyle = '#2f6b3a';
  ctx.strokeStyle = '#1c3d24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x + w / 2, GY - 8, w * 0.55, 16, 0, 0, 7);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6a2a86';
  for (var i = 0; i < 5; i++) {
    var tx = x + 6 + i * (w - 8) / 4;
    ctx.beginPath();
    ctx.moveTo(tx, GY - 10);
    ctx.lineTo(tx + 6, top + 4);
    ctx.lineTo(tx + 12, GY - 8);
    ctx.fill();
  }
  /* angry eyes */
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + w * 0.3, GY - 16, 4, 4);
  ctx.fillRect(x + w * 0.55, GY - 16, 4, 4);
}

function drawPad() {
  var x = PAD.x, w = PAD.w;
  var squash = PAD.hot * 8;
  ctx.save();
  ctx.translate(x + w / 2, GY);
  /* spring */
  ctx.strokeStyle = '#f2f2f2';
  ctx.lineWidth = 3;
  ctx.beginPath();
  var coils = 4;
  for (var i = 0; i <= coils * 8; i++) {
    var t = i / (coils * 8);
    var yy = -8 - t * (18 - squash);
    var xx = Math.sin(t * coils * Math.PI * 2) * 8;
    if (i === 0) ctx.moveTo(xx, yy);
    else ctx.lineTo(xx, yy);
  }
  ctx.stroke();
  ctx.fillStyle = '#c6f54a';
  ctx.strokeStyle = '#3e6a12';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, -32 + squash, 22, 12 - squash * 0.3, 0, Math.PI, 0);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, -36 + squash, 2.4, 0, 7);
  ctx.arc(6, -34 + squash, 2, 0, 7);
  ctx.fill();
  /* up chevrons */
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-6, -48 + squash); ctx.lineTo(0, -56 + squash); ctx.lineTo(6, -48 + squash);
  ctx.stroke();
  ctx.restore();
}

function starPath(x, y, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 5; i++) {
    var a = rot + i * Math.PI * 2 / 5 - Math.PI / 2;
    var b = a + Math.PI / 5;
    var px = x + Math.cos(a) * r;
    var py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    ctx.lineTo(x + Math.cos(b) * r * 0.42, y + Math.sin(b) * r * 0.42);
  }
  ctx.closePath();
}

function drawStar(x, y, r, rot) {
  ctx.save();
  var pulse = 1 + Math.sin(animT * 5 + rot) * 0.08;
  ctx.translate(x, y + Math.sin(animT * 3 + x) * 3);
  ctx.scale(pulse, pulse);
  ctx.translate(-x, -y);
  ctx.fillStyle = '#ffe36a';
  ctx.strokeStyle = '#c98412';
  ctx.lineWidth = 2;
  starPath(x, y, r, rot);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff8d0';
  starPath(x, y, r * 0.45, rot);
  ctx.fill();
  ctx.restore();
}

function drawSign(s) {
  ctx.fillStyle = '#c98552';
  ctx.fillRect(s.x - 3, s.y, 6, GY - s.y);
  ctx.fillStyle = '#fff8ef';
  ctx.strokeStyle = '#e23e78';
  ctx.lineWidth = 2;
  roundRect(s.x - 28, s.y - 22, 56, 26, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e23e78';
  ctx.font = '800 14px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s.text, s.x, s.y - 9);
  ctx.textBaseline = 'alphabetic';
}

function drawFlag(x, taken, num) {
  ctx.fillStyle = '#efe7da';
  ctx.strokeStyle = '#5a4636';
  ctx.lineWidth = 2;
  ctx.fillRect(x - 2, GY - 78, 5, 78);
  ctx.strokeRect(x - 2, GY - 78, 5, 78);
  ctx.fillStyle = taken ? '#7d8cff' : '#ffd15c';
  ctx.beginPath();
  var wave = Math.sin(animT * 4 + x) * 3;
  ctx.moveTo(x + 3, GY - 76);
  ctx.lineTo(x + 32, GY - 64 + wave);
  ctx.lineTo(x + 3, GY - 52);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#3a2740';
  ctx.font = '800 12px ' + FONT;
  ctx.textAlign = 'left';
  ctx.fillText(String(num), x + 8, GY - 60 + wave);
}

  ctx.moveTo(22, -168); ctx.lineTo(49, -198); ctx.lineTo(76, -168); ctx.closePath();

  /* arch */

  ctx.lineTo(-28, -120);

  ctx.moveTo(0, -110);
  ctx.lineTo(0, 0);
  ctx.stroke();
  ctx.setLineDash([]);
  /* windows */
  ctx.fillStyle = '#ffe08a';
  ctx.fillRect(-58, -140, 12, 16);
  ctx.fillRect(42, -140, 12, 16);
  ctx.fillRect(-58, -100, 12, 16);

}

function drawCosmetic(cam) {
  var fake = {
    name: '',
    isPlayer: true,
    color: '#3aa0ff',
    shoe: '#1d4e89',
    skin: '#ffe3cf',
    kind: 'hero',
    x: cam + Math.min(viewW * 0.42, 280),
    y: GY,
    vx: 140,
    vy: 0,
    onGround: true,
    facing: 1,
    phase: animT * 10,
    dashing: false,
    squish: 0,
    finished: false,
    hurt: 0,
    starT: 0
  };
  drawRunner(fake, 1, 0);
}

function drawRunner(r, alpha, xoff) {
  if (r.hurt > 0 && Math.floor(r.hurt * 16) % 2 === 0) alpha *= 0.45;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(r.x + xoff, r.y);
  /* shadow */
  ctx.fillStyle = 'rgba(50,30,40,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 3, 16, 5, 0, 0, 7);
  ctx.fill();

  var lean = 0;
  if (!r.onGround) lean = -0.08;
  else if (r.dashing) lean = 0.22;
  else if (r.vx > 40) lean = 0.08;
  ctx.rotate(lean);
  ctx.scale(r.facing || 1, 1);
  var bob = r.onGround ? Math.sin(r.phase) * 2.2 : 0;
  ctx.translate(0, bob);
  var sq = r.squish || 0;
  ctx.scale(1 + sq * 0.12, 1 - sq * 0.18);

  ctx.lineJoin = 'round';
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = '#3a2740';

  /* cape */
  ctx.fillStyle = r.color;
  ctx.beginPath();
  var flap = Math.sin(animT * 7 + r.phase) * 5;
  ctx.moveTo(-4, -46);
  ctx.quadraticCurveTo(-26 - flap, -28, -10, -8);
  ctx.lineTo(-2, -12);
  ctx.quadraticCurveTo(-12, -30, 2, -44);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  var air = !r.onGround;
  var sw = Math.sin(r.phase);
  drawLimb(-5, -18, air ? -0.9 : sw * 0.8, r.shoe);
  drawLimb(5, -18, air ? 0.5 : -sw * 0.8, r.shoe);

  /* body */
  ctx.fillStyle = r.color;
  ctx.beginPath();
  ctx.ellipse(0, -30, 13, 14, 0, 0, 7);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-3, -34, 4, 5, -0.4, 0, 7);
  ctx.fill();

  /* arms */
  ctx.strokeStyle = r.skin;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-8, -34);
  ctx.lineTo(-14, air ? -48 : -24 + sw * 4);
  ctx.moveTo(8, -34);
  ctx.lineTo(14, air ? -46 : -22 - sw * 4);
  ctx.stroke();
  ctx.strokeStyle = '#3a2740';
  ctx.lineWidth = 2.4;

  /* kind bits behind head */
  if (r.kind === 'bunny') {
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.ellipse(-7, -78, 5, 14, -0.2, 0, 7);
    ctx.ellipse(7, -78, 5, 14, 0.2, 0, 7);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd0e4';
    ctx.beginPath();
    ctx.ellipse(-7, -78, 2.2, 8, -0.2, 0, 7);
    ctx.ellipse(7, -78, 2.2, 8, 0.2, 0, 7);
    ctx.fill();
  }

  /* head */
  ctx.fillStyle = r.skin;
  ctx.beginPath();
  ctx.arc(0, -52, 16, 0, 7);
  ctx.fill(); ctx.stroke();

  /* hood */
  ctx.fillStyle = r.color;
  ctx.beginPath();
  ctx.arc(0, -54, 17, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(14, -44, 8, -40);
  ctx.lineTo(-8, -40);
  ctx.quadraticCurveTo(-14, -44, -16, -50);
  ctx.fill();
  ctx.stroke();

  if (r.kind === 'pumpkin') {
    ctx.fillStyle = '#ff9a2a';
    ctx.beginPath();
    ctx.arc(0, -50, 17, Math.PI, 0);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#d06a10';
    ctx.beginPath();
    ctx.moveTo(0, -66); ctx.lineTo(0, -48);
    ctx.moveTo(-6, -64); ctx.lineTo(-5, -50);
    ctx.moveTo(6, -64); ctx.lineTo(5, -50);
    ctx.stroke();
    ctx.fillStyle = '#3e9a32';
    ctx.fillRect(-2, -74, 5, 10);
    ctx.strokeStyle = '#3a2740';
  } else if (r.kind === 'star') {
    ctx.fillStyle = '#ffe36a';
    ctx.strokeStyle = '#c98412';
    starPath(0, -74, 8, -animT);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#3a2740';
  } else if (r.kind === 'mush') {
    ctx.fillStyle = '#e23d4a';
    ctx.beginPath();
    ctx.ellipse(0, -66, 16, 10, 0, Math.PI, 0);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -70, 2.2, 0, 7);
    ctx.arc(5, -68, 1.6, 0, 7);
    ctx.fill();
  } else if (r.kind === 'candy') {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-16, -52); ctx.lineTo(-26, -58); ctx.lineTo(-26, -46); ctx.closePath();
    ctx.moveTo(16, -52); ctx.lineTo(26, -58); ctx.lineTo(26, -46); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  /* face */
  ctx.fillStyle = '#3a2740';
  var eyeY = -54;
  ctx.beginPath();
  ctx.arc(-5, eyeY, 2.1, 0, 7);
  ctx.arc(5, eyeY, 2.1, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(-6, eyeY - 2, 1.4, 1.4);
  ctx.fillRect(4, eyeY - 2, 1.4, 1.4);
  ctx.fillStyle = '#ff9db5';
  ctx.beginPath();
  ctx.ellipse(-10, -49, 2.4, 1.5, 0, 0, 7);
  ctx.ellipse(10, -49, 2.4, 1.5, 0, 0, 7);
  ctx.fill();
  ctx.strokeStyle = '#3a2740';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(0, -49, 3.2, 0.15, Math.PI - 0.15);
  ctx.stroke();

  /* speed lines */
  if (r.dashing) {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    for (var i = 0; i < 3; i++) {
      var yy = -20 - i * 12;
      ctx.beginPath();
      ctx.moveTo(-18 - i * 6, yy);
      ctx.lineTo(-34 - i * 8, yy + 2);
      ctx.stroke();
    }
  }
  if (r.starT > 0) {
    ctx.fillStyle = '#ffe36a';
    ctx.globalAlpha = alpha * 0.9;
    ctx.fillRect(10, -70, 4, 4);
    ctx.fillRect(-16, -30, 3, 3);
  }

  ctx.restore();

  if (!r.isPlayer && r.name && screen !== 'menu') {
    ctx.save();
    ctx.font = '800 15px ' + FONT;
    ctx.textAlign = 'center';
    var tw = ctx.measureText(r.name).width + 12;
    var ty = r.y - PH - 16 + (r.onGround ? Math.sin(r.phase) * 2 : 0);
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2;
    roundRect(r.x - tw / 2, ty - 13, tw, 18, 7);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a2740';
    ctx.fillText(r.name, r.x, ty);
    ctx.restore();
  }

  if (r.dashing && alpha > 0.8) {
    drawRunnerGhost(r);
  }
}

function drawRunnerGhost(r) {
  /* cheap afterimage: a translucent ellipse trail, not a full redraw recursion */
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = r.color;
  ctx.beginPath();
  ctx.ellipse(r.x - r.facing * 16, r.y - 36, 10, 16, 0, 0, 7);
  ctx.fill();
  ctx.restore();
}

function drawLimb(x, y, ang, shoe) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = '#3a2740';
  ctx.strokeStyle = '#3a2740';
  ctx.lineWidth = 2;
  roundRect(-3, 0, 6, 14, 3);
  ctx.fill();
  ctx.fillStyle = shoe;
  roundRect(-4, 11, 10, 5, 2);
  ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  var rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* ================= UI ================= */
function setOverlays() {
  $('menu').hidden = screen !== 'menu';
  $('hud').hidden = !(screen === 'race' || screen === 'countdown' || screen === 'paused');
  $('pause').hidden = screen !== 'paused';
  $('results').hidden = screen !== 'results';
  if (screen !== 'countdown') countEl.hidden = true;
  var showCtrl = screen === 'race' || screen === 'countdown';
  $('leftPad').style.visibility = showCtrl ? 'visible' : 'hidden';
  $('rightPad').style.visibility = showCtrl ? 'visible' : 'hidden';
}

function showCD() {
  countEl.hidden = false;
  countEl.textContent = CD[cdI].text;
  countEl.className = CD[cdI].text === '開跑！' ? 'go' : '';
}

function showPenalty() {
  penaltyEl.hidden = false;
  penaltyEl.classList.remove('go');
  void penaltyEl.offsetWidth;
  penaltyEl.classList.add('go');
  setTimeout(function () { penaltyEl.hidden = true; }, 950);
}

function buildTrack() {
  var marks = $('trackMarks');
  marks.innerHTML = '';
  function add(x, cls) {
    var d = document.createElement('div');
    d.className = 'mark ' + cls;
    d.style.left = (x / FINISH_X * 100) + '%';
    marks.appendChild(d);
  }
  add(0, 'start');
  for (var i = 0; i < CHECKPOINTS.length; i++) add(CHECKPOINTS[i], 'cp');
  add(FINISH_X, 'finish');
  var dots = $('trackDots');
  dots.innerHTML = '';
  for (var r = 0; r < runners.length; r++) {
    var el = document.createElement('div');
    el.className = 'dot' + (runners[r].isPlayer ? ' me' : '');
    el.style.background = runners[r].color;
    dots.appendChild(el);
  }
}

function updateHudDOM() {
  if (!player) return;
  var label;
  if (mode === 'solo') {
    var passed = player.cp + 1;
    if (passed < 0) passed = 0;
    label = '檢查點 ' + passed + '/' + CHECKPOINTS.length;
  } else {
    label = '第' + player.rank + '名';
  }
  if (rankMain.textContent !== label) rankMain.textContent = label;
  var shownT = player.finished ? player.finishTime : player.time;
  var clock = fmtClock(shownT || 0);
  if (timeBox.textContent !== clock) timeBox.textContent = clock;
  var pct = Math.max(0, Math.min(100, player.stamina));
  stamFill.style.width = pct + '%';
  stamFill.style.background = pct < 25 ? 'linear-gradient(#ffb0b0,#e23e4a)' :
    pct < 55 ? 'linear-gradient(#ffe08a,#f0a020)' : 'linear-gradient(#b8ff7a,#2fbe55)';
  btnDash.classList.toggle('low', player.stamina < STAMINA_MIN && !player.dashing);
  var pProg = Math.max(0, Math.min(1, player.x / FINISH_X));
  trackFill.style.width = (pProg * 100) + '%';
  var dots = $('trackDots').children;
  for (var i = 0; i < runners.length && i < dots.length; i++) {
    var px = Math.max(0, Math.min(1, runners[i].x / FINISH_X)) * 100;
    dots[i].style.left = px + '%';
  }
}

function fmtClock(t) {
  if (t < 0 || !isFinite(t)) t = 0;
  var cs = Math.floor((t % 1) * 100);
  var sec = Math.floor(t) % 60;
  var min = Math.floor(t / 60);
  function p2(n) { n = n | 0; return (n < 10 ? '0' : '') + n; }
  return p2(min) + ':' + p2(sec) + '.' + p2(cs);
}

function fmtSec(t) {
  return (Math.round(t * 100) / 100).toFixed(2);
}

function loadBest() {
  try {
    var s = localStorage.getItem('talesdash_best');
    if (s == null || s === '') return null;
    var n = parseFloat(s);
    return isFinite(n) ? n : null;
  } catch (e) { return null; }
}

function saveBest(n) {
  try { localStorage.setItem('talesdash_best', String(n)); } catch (e) {}
}

function refreshBest() {
  var b = loadBest();
  $('bestLine').textContent = b == null ? '最佳時間：未有紀錄' : ('最佳時間：' + fmtSec(b) + ' 秒');
}

function showResults() {
  if (resultsLock) return;
  resultsLock = true;
  screen = 'results';
  var body = $('resBody');
  var title = $('resTitle');
  if (mode === 'solo') {
    title.textContent = '衝線！';
    var t = player.finishTime || player.time;
    var best = loadBest();
    var isNew = player.finished && (best == null || t < best - 0.0001);
    if (isNew) saveBest(t);
    var b2 = loadBest();
    body.innerHTML =
      '<div class="soloTime">你的時間：' + fmtSec(t) + ' 秒</div>' +
      '<div class="soloTime">最佳時間：' + (b2 == null ? '未有紀錄' : fmtSec(b2) + ' 秒') + '</div>' +
      (isNew ? '<div class="newrec">新紀錄！</div>' : '');
  } else {
    title.textContent = '比賽結果';
    rankRunners();
    var rows = runners.slice().sort(function (a, b) { return a.rank - b.rank; });
    var html = '<table class="board"><thead><tr><th>名次</th><th>跑手</th><th>時間</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var timeCell = r.finished && r.finishTime != null ? (fmtSec(r.finishTime) + ' 秒') : '未完成';
      html += '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + r.rank +
        '</td><td>' + r.name + '</td><td>' + timeCell + '</td></tr>';
    }
    html += '</tbody></table>';
    body.innerHTML = html;
  }
  refreshBest();
  setOverlays();
}

/* ================= input ================= */
function bindHold(btn, action) {
  function down(e) {
    e.preventDefault();
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    ptrMap.set(e.pointerId, action);
    recomputeTouch();
    if (action === 'jump' && screen === 'race') jumpQueued = true;
    ensureAudio();
  }
  function up(e) {
    ptrMap.delete(e.pointerId);
    recomputeTouch();
  }
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
}

function recomputeTouch() {
  touchL = touchR = touchD = false;
  ptrMap.forEach(function (v) {
    if (v === 'left') touchL = true;
    if (v === 'right') touchR = true;
    if (v === 'dash') touchD = true;
  });
}

function onKeyDown(e) {
  var code = e.code;
  if (code === 'ArrowLeft' || code === 'ArrowRight' || code === 'ArrowUp' || code === 'Space' ||
      code === 'KeyW' || code === 'KeyA' || code === 'KeyD') {
    e.preventDefault();
  }
  ensureAudio();
  if (e.repeat && code !== 'ArrowLeft' && code !== 'ArrowRight' && code !== 'KeyA' && code !== 'KeyD' &&
      code !== 'ShiftLeft' && code !== 'ShiftRight' && code !== 'KeyK') return;
  if (code === 'ArrowLeft' || code === 'KeyA') keyL = true;
  else if (code === 'ArrowRight' || code === 'KeyD') keyR = true;
  else if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyK') keyD = true;
  else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
    if (!e.repeat && screen === 'race') jumpQueued = true;
  } else if (code === 'KeyP' || code === 'Escape') {
    if (e.repeat) return;
    if (screen === 'race' || screen === 'countdown') doPause();
    else if (screen === 'paused') doResume();
    else if (screen === 'results') goMenu();
  } else if (code === 'KeyR') {
    if (e.repeat) return;
    if (screen === 'race' || screen === 'paused' || screen === 'countdown' || screen === 'results') doRestart();
  }
}

function onKeyUp(e) {
  var code = e.code;
  if (code === 'ArrowLeft' || code === 'KeyA') keyL = false;
  else if (code === 'ArrowRight' || code === 'KeyD') keyR = false;
  else if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyK') {
    var still = false;
    /* can't know the other shift easily; clear and let the other keydown reset — both map to keyD.
       If one shift is released while the other is held, keyup clears. Acceptable. */
    if (code === 'KeyK') keyD = false;
    else keyD = false;
    void still;
  }
}

/* ================= audio ================= */
function ensureAudio() {
  if (audioOn && actx && actx.state !== 'suspended') return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    audioOn = true;
  } catch (e) {
    audioOn = false;
  }
}

function beep(freq, dur, type, vol, toFreq, delay) {
  if (!audioOn || !actx) return;
  try {
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), t0 + dur);
    g.gain.setValueAtTime(vol == null ? 0.05 : vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  } catch (e) {}
}

function sfxCount(text) {
  if (text === '開跑！') {
    beep(523, 0.1, 'square', 0.04, 0, 0);
    beep(659, 0.1, 'square', 0.04, 0, 0.09);
    beep(784, 0.18, 'square', 0.05, 0, 0.18);
  } else if (text === '3') beep(494, 0.12, 'square', 0.045);
  else if (text === '2') beep(554, 0.12, 'square', 0.045);
  else beep(622, 0.12, 'square', 0.045);
}

function sfxJump() { beep(420, 0.07, 'sine', 0.05, 680); }
function sfxPad() { beep(300, 0.12, 'triangle', 0.06, 720); }
function sfxStar() { beep(880, 0.09, 'sine', 0.05, 1320); }
function sfxFall() { beep(220, 0.22, 'triangle', 0.06, 70); }
function sfxCheckpoint() { beep(660, 0.08, 'sine', 0.04, 880); }
function sfxFinish() {
  beep(523, 0.12, 'square', 0.05, 0, 0);
  beep(659, 0.12, 'square', 0.05, 0, 0.1);
  beep(784, 0.12, 'square', 0.05, 0, 0.2);
  beep(1046, 0.22, 'square', 0.05, 0, 0.3);
}

/* ================= loop ================= */
var acc = 0;
var lastTs = 0;

function frame(ts) {
  if (!lastTs) lastTs = ts;
  var raw = (ts - lastTs) / 1000;
  lastTs = ts;
  if (raw < 0) raw = 0;
  if (raw > 0.05) raw = 0.05;
  var dt = raw * timeScale;
  acc += dt;
  var maxSteps = Math.min(480, Math.max(8, Math.ceil(timeScale * 30)));
  var n = 0;
  while (acc >= STEP && n < maxSteps) {
    stepAll(STEP);
    acc -= STEP;
    n++;
  }
  if (n >= maxSteps) acc = 0;
  render();
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function boot() {
  canvas = $('view');
  ctx = canvas.getContext('2d', { alpha: false });
  stamFill = $('stamFill');
  rankMain = $('rankMain');
  timeBox = $('timeBox');
  trackFill = $('trackFill');
  btnDash = $('btnDash');
  countEl = $('count');
  penaltyEl = $('penalty');
  buildLevel();
  refreshBest();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 60); });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (!e.target.closest('.overlay')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', function () { keyL = keyR = keyD = false; });

  bindHold($('btnLeft'), 'left');
  bindHold($('btnRight'), 'right');
  bindHold($('btnJump'), 'jump');
  bindHold($('btnDash'), 'dash');

  $('btnPause').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
  });
  $('btnPause').addEventListener('click', function () { doPause(); });
  $('btnSolo').addEventListener('click', function () { ensureAudio(); startRace('solo'); });
  $('btnVs').addEventListener('click', function () { ensureAudio(); startRace('vs', aiCount); });
  $('btnResume').addEventListener('click', function () { doResume(); });
  $('btnPauseRestart').addEventListener('click', function () { doRestart(); });
  $('btnPauseMenu').addEventListener('click', function () { goMenu(); });
  $('btnAgain').addEventListener('click', function () { doRestart(); });
  $('btnResMenu').addEventListener('click', function () { goMenu(); });

  var aiBtns = document.querySelectorAll('.aiN');
  for (var i = 0; i < aiBtns.length; i++) {
    aiBtns[i].addEventListener('click', function (ev) {
      aiCount = parseInt(ev.currentTarget.getAttribute('data-n'), 10) || 4;
      for (var k = 0; k < aiBtns.length; k++) {
        aiBtns[k].classList.toggle('on', aiBtns[k] === ev.currentTarget);
      }
    });
  }

  window.__td = {
    state: function () {
      var list = [];
      for (var i = 0; i < runners.length; i++) {
        var r = runners[i];
        list.push({
          name: r.name,
          x: r.x,
          y: r.y,
          finished: !!r.finished,
          finishTime: r.finished ? r.finishTime : null,
          rank: r.rank,
          isPlayer: !!r.isPlayer
        });
      }
      return {
        screen: screen,
        mode: mode,
        time: player ? (player.finished ? player.finishTime : player.time) : 0,
        runners: list,
        trackLength: TRACK_LEN
      };
    },
    start: function (m, n) {
      startRace(m === 'vs' ? 'vs' : 'solo', n);
    },
    autopilot: function (on) { autopilotOn = !!on; },
    timeScale: function (n) {
      var v = Number(n);
      timeScale = isFinite(v) && v > 0 ? v : 1;
    }
  };

  setOverlays();
  requestAnimationFrame(frame);
}

boot();
</script>
</body>
</html>
